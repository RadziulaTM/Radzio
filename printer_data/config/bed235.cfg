# --- CZUJNIK TEMP.  ---
[temperature_sensor EBB_NTC]
sensor_type: Generic 3950
sensor_pin: EBBCan:gpio28

[temperature_sensor btt_eddy_mcu]
sensor_type: temperature_mcu # Sets the type of sensor for Klipper to read
sensor_mcu: eddy # Sets the MCU of the eddy probe tempereature sensor
min_temp: 10 # Sets the minimum tempereature for eddys tempereature sensor to operate
max_temp: 100
# ==============================================================================
# === GRZANA PŁYTA (HEATER BED) ===
# ==============================================================================
[heater_bed]
heater_pin: PB2
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA3
#control: watermark
min_temp: 0
max_temp: 130

# ==============================================================================
# === CZUJNIK POZIOMOWANIA (BTT EDDY) ===
# ==============================================================================
[probe_eddy_current btt_eddy]
sensor_type: ldc1612
z_offset: 2.5
i2c_mcu: eddy
i2c_bus: i2c0f
x_offset: 0
y_offset: 22.8

[temperature_probe btt_eddy]
sensor_type: Generic 3950
sensor_pin: eddy:gpio26
horizontal_move_z: 2

# ==============================================================================
# === AKCELEROMETR (ADXL345) & TEST REZONANSU ===
# ==============================================================================





# ==============================================================================
# === SIATKA STOŁU (BED MESH) & HOME Z ===
# ==============================================================================
[bed_mesh]
horizontal_move_z: 2
speed: 200
mesh_min: 2, 17
mesh_max: 217, 213
probe_count: 9, 9
algorithm: bicubic


[safe_z_home]
home_xy_position: 111, 122.5
z_hop: 10
z_hop_speed: 25
speed: 200